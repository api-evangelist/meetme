name: MeetMe
description: MeetMe is a consumer social-discovery and chat platform that helps people find and
  connect with new people nearby who share their interests, through profiles, feeds, live streaming,
  and real-time messaging on web and mobile. Operated by The Meet Group as part of the ParshipMeet
  Group, MeetMe grew out of the myYearbook social network and today runs as a location-aware social
  networking and dating-adjacent app. It was surfaced as a portfolio company of a16z and Norwest
  Venture Partners and added to the API Evangelist network. As of this enrichment pass MeetMe
  publishes no public developer portal, API reference, OpenAPI, or SDKs — this profile captures its
  identity, legal surface, and live domain-security posture only.
